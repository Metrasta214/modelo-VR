<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor 3D VR - SketchUp</title>

    <link
      rel="icon"
      href="https://cdn-icons-png.flaticon.com/512/3616/3616982.png"
      type="image/png"
    />
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Visor 3D VR</a>
      </div>
    </nav>

    <main class="container-fluid p-0">
      <div id="viewer"></div>
    </main>

    <button
      id="btnVR"
      class="btn btn-primary position-fixed bottom-0 start-50 translate-middle-x mb-5 z-3"
    >
      Activar modo VR
    </button>

    <footer id="footer" class="bg-dark text-white text-center py-3">
      <p class="mb-0">Programador: Álvaro Madrid Morales</p>
      <small>Proyecto web con Three.js, Bootstrap y Cardboard V2</small>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
